<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch | SkillCraft Task 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background decoration -->
    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>
    <div class="background-circle circle-three"></div>


    <!-- Main Container -->
    <main class="stopwatch-container">

        <!-- Header -->
        <header class="header">

            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-stopwatch"></i>
                </div>

                <div>
                    <h1>Stopwatch</h1>
                    <p>SkillCraft Technology</p>
                </div>
            </div>

            

        </header>


        <!-- Stopwatch Card -->
        <section class="stopwatch-card">

            <div class="status" id="status">
                <span class="status-dot"></span>
                Ready
            </div>


            <!-- Time Display -->
            <div class="time-display">

                <span id="hours">00</span>
                <span class="separator">:</span>

                <span id="minutes">00</span>
                <span class="separator">:</span>

                <span id="seconds">00</span>

                <span class="milliseconds">
                    .<span id="milliseconds">00</span>
                </span>

            </div>


            <p class="time-label">
                HOURS &nbsp;&nbsp; MINUTES &nbsp;&nbsp; SECONDS
            </p>


            <!-- Buttons -->
            <div class="controls">

                <button
                    class="control-btn start-btn"
                    id="startBtn">

                    <i class="fa-solid fa-play"></i>
                    Start

                </button>


                <button
                    class="control-btn pause-btn"
                    id="pauseBtn"
                    disabled>

                    <i class="fa-solid fa-pause"></i>
                    Pause

                </button>


                <button
                    class="control-btn lap-btn"
                    id="lapBtn"
                    disabled>

                    <i class="fa-solid fa-flag"></i>
                    Lap

                </button>


                <button
                    class="control-btn reset-btn"
                    id="resetBtn">

                    <i class="fa-solid fa-rotate-right"></i>
                    Reset

                </button>

            </div>

        </section>


        <!-- Lap Section -->
        <section class="laps-section">

            <div class="laps-header">

                <div>
                    <h2>
                        <i class="fa-solid fa-list-check"></i>
                        Lap Times
                    </h2>

                    <p>
                        Your recorded split times
                    </p>
                </div>

                <span id="lapCount" class="lap-count">
                    0 Laps
                </span>

            </div>


            <div id="lapsContainer" class="laps-container">

                <div class="empty-laps" id="emptyLaps">

                    <i class="fa-regular fa-clock"></i>

                    <p>No laps recorded yet</p>

                    <span>
                        Start the stopwatch and press Lap
                    </span>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                <i class="fa-solid fa-code"></i>
                Built with HTML, CSS & JavaScript
            </p>

            <span>
                SkillCraft Web Development Internship
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
